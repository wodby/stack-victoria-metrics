name: victoria-metrics
title: VictoriaMetrics
icon: victoriametrics
docs: https://wodby.com/docs/2.0/stacks/catalog/victoria-metrics/

services:
- name: victoria-metrics
  title: VictoriaMetrics
  service: victoria-metrics
  required: true
  volumes:
  - name: data
    size: 20
- name: otel-collector
  title: OpenTelemetry Collector
  service: opentelemetry-collector
  links:
  - name: metrics
    service: victoria-metrics
- name: grafana
  title: Grafana
  service: grafana
  main: true
  links:
  - name: victoria-metrics
    service: victoria-metrics
  configs:
  - name: datasources
    config: configs/grafana-datasources.yml.tmpl
  volumes:
  - name: data
    size: 10
